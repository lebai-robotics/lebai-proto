syntax = "proto3";

package lebai.message;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// 消息等级
enum Level {
  // 提示
  INFO = 0;
  // 警告
  WARN = 1;
  // 故障
  ERROR = 2;
}
// 消息类型
enum Kind {
  // 急停
  ESTOP = 0;
  // 当前状态不能OTA升级
  OTA_STATE_ERROR = 1004;
  // OTA升级失败
  OTA_FAILED = 1005;
  // 关节速度超出限制
  JONIT_SPEED_EXCEED = 1007;
  // 关节超出临界位置
  REACH_JOINT_LIMIT = 1008;
  // 机器人可能被碰撞
  COLLISION_DETECTED = 1009;
  // 请释放硬件急停开关后重试
  HARD_ESTOP_LOCK = 1011;
  // 硬件驱动故障
  DRIVER_ERROR = 1100;
  // 机器人运动规划出错
  TRAJECTOR_ERROR = 1140;
  // 关节位置异常
  PositionAbnormal = 1141;
}

message Message {
  Level level = 1;
  // 信息类型，前端提供国际化
  Kind kind = 2;
  // 详细信息，供内部人员查看
  string detail = 3;
  // 消息产生时间
  google.protobuf.Timestamp time = 11;
}
message Messages {
  repeated Message messages = 1;
}

// 消息相关服务
service MessageService {
  rpc GetMessages(google.protobuf.Empty) returns (Messages);
  rpc SubMessage(google.protobuf.Empty) returns (stream Message);
}
